name: Jadwal Kontes

on:
  schedule:
    # Setiap hari 22:30 UTC = 05:30 WIB
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: soal-mingguan
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ambil jadwal kontes
        run: node scripts/update-contests.mjs
      - name: Simpan ke repository
        run: |
          if git diff --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contests.json
          git commit -m "Jadwal kontes $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

  deploy:
    needs: update
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
